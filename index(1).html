<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}button{border:0;border-radius:8px;padding:18px 36px;background:#f2f2f2;color:#111;font-size:20px;font-weight:700;cursor:pointer}#player{display:none;width:min(100vw,560px);aspect-ratio:16/9}
</style>
</head>
<body>
<button id="trust">TRUST ME</button>
<div id="player"></div>
<script>
const button=document.getElementById('trust');
button.addEventListener('click',()=>{
 button.style.display='none';
 const player=document.getElementById('player');
 player.style.display='block';
 player.innerHTML='<iframe width="100%" height="100%" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&loop=1&playlist=dQw4w9WgXcQ" title="Video player" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
});
</script>
</body>
</html>
