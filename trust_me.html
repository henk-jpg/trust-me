<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { min-height: 100vh; display: grid; place-items: center; }
    button {
      border: 0; border-radius: 12px; padding: 18px 34px;
      background: #f2f2f2; color: #111; font: 700 20px system-ui, sans-serif;
      cursor: pointer;
    }
    button:active { transform: scale(.98); }
    #player { position: fixed; width: 1px; height: 1px; left: -10px; top: -10px; }
  </style>
</head>
<body>
  <button id="trust">TRUST ME</button>
  <div id="player"></div>
  <script>
    document.getElementById('trust').addEventListener('click', () => {
      const frame = document.createElement('iframe');
      frame.width = '1'; frame.height = '1';
      frame.src = 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&loop=1&playlist=dQw4w9WgXcQ';
      frame.allow = 'autoplay; encrypted-media';
      frame.title = 'Rickroll';
      document.getElementById('player').replaceChildren(frame);
    }, { once: true });
  </script>
</body>
</html>
