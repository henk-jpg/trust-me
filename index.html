<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title></title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}#start{border:0;border-radius:10px;padding:18px 34px;background:#fff;color:#000;font-size:20px;font-weight:700;cursor:pointer}#video{display:none;width:100%;max-width:560px;aspect-ratio:16/9}#video iframe{width:100%;height:100%;border:0}</style></head>
<body><button id="start">TRUST ME</button><div id="video"></div>
<script>document.getElementById('start').addEventListener('click',function(){this.style.display='none';const box=document.getElementById('video');box.style.display='block';box.innerHTML='<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&playsinline=1" title="Rickroll" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';});</script></body></html>
